<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Hyperframes Multi-Layer 9:16 (Three.js + Shaders + RoughJS + Lottie + Karaoke ZeroTTS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Hyperframes Core Runtimes -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_light.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>

    <style>
      :root {
        --ground: #070510;
        --accent-cyan: #00f2fe;
        --accent-magenta: #ff007a;
        --accent-gold: #ffe600;
        --font-display: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
        -webkit-font-smoothing: antialiased;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }

      /* ==========================================================================
         Layer 0: Three.js Canvas (Background Shader + 3D Mesh)
         ========================================================================== */
      #three-layer {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        z-index: 1;
        display: block;
        pointer-events: none;
      }

      /* ==========================================================================
         Layer 1a: RoughJS Doodle 2D Canvas (Boiling Line Hand-Drawn Sketch)
         ========================================================================== */
      #doodle-layer {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        z-index: 10;
        display: block;
        pointer-events: none;
      }

      /* ==========================================================================
         Layer 1b: Lottie Vector Animation (Pulsing Vector Audio Badge)
         ========================================================================== */
      #lottie-layer {
        position: absolute;
        top: 140px;
        right: 60px;
        width: 240px;
        height: 240px;
        z-index: 15;
        pointer-events: none;
      }

      /* ==========================================================================
         Layer 2: Karaoke ZeroTTS Subtitles & Kinetic Typography
         ========================================================================== */
      #karaoke-layer {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }

      /* Header UI Overlay */
      .hud-header {
        position: absolute;
        top: 80px;
        left: 60px;
        z-index: 25;
        pointer-events: none;
        display: flex;
        flex-direction: column;

      }

      .hud-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: 24px;

      .hud-pill .dot {

      /* Center Title Anchor for RoughJS Doodle Highlight */
      .center-focus-title {
        position: absolute;
        top: 290px;
        left: 0;
        width: 1080px;
        text-align: center;
        z-index: 12;
        pointer-events: none;
        padding: 0 60px;
      }

      .center-focus-title h1 {
        font-size: 64px;
        font-weight: 900;
        line-height: 1.15;
        letter-spacing: -0.03em;
        color: #ffffff;
        text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
      }
    </style>

  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <!-- Layer 0 (Bottom): Three.js WebGL Canvas (Background Shader + 3D Mesh) -->
      <canvas id="three-layer" class="clip" data-start="0" data-duration="10" data-track-index="0"></canvas>

      <!-- Layer 1a: RoughJS Hand-Drawn Doodle 2D Canvas -->
      <canvas id="doodle-layer" class="clip" data-start="0" data-duration="10" data-track-index="1"></canvas>

      <!-- Layer 1b: Lottie Vector Animation -->
      <div id="lottie-layer" class="clip" data-start="0" data-duration="10" data-track-index="2"></div>

      <!-- Layer 2 (Top): ZeroTTS Word-by-Word Karaoke Subtitles -->
      <div id="karaoke-layer" class="clip" data-start="0" data-duration="10" data-track-index="3" data-track-kind="captions"></div>

      <!-- UI Branding Overlay -->
      <div class="hud-header clip" data-start="0" data-duration="10" data-track-index="4">
        <div class="hud-pill">
          <span class="dot"></span>
          <span>Hyperframes Multi-Layer</span>
        </div>
        <div class="hud-meta">9:16 Portrait • 1080x1920 • 30 FPS</div>
      </div>

      <div class="center-focus-title clip" data-start="0" data-duration="10" data-track-index="5">
        <h1>KIẾN TRÚC ĐỒ HỌA ĐA TẦNG</h1>
      </div>
    </div>

    <!-- Multi-Layer Imperative Orchestrator Script -->
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

      // ======================================================================
      // 1. Shaders: Liquid SDF Metaballs Background
      // ======================================================================
      const VERTEX_SHADER_QUAD = /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `;

      const FRAGMENT_SHADER_LIQUID_SDF = /* glsl */ `
        precision highp float;
        uniform float uTime;
        uniform vec2 uResolution;
        uniform float uProgress;
        varying vec2 vUv;

        float smin(float a, float b, float k) {
          float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
          return mix(b, a, h) - k * h * (1.0 - h);
        }

        vec2 rotate(vec2 p, float a) {
          float c = cos(a);
          float s = sin(a);
          return vec2(p.x * c - p.y * s, p.x * s + p.y * c);
        }

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          vec2 shift = vec2(100.0);
          for (int i = 0; i < 4; ++i) {
            v += a * noise(p);
            p = rotate(p * 2.0, 0.5) + shift;
            a *= 0.5;
          }
          return v;
        }

        float sdCircle(vec2 p, float r) {
          return length(p) - r;
        }

        void main() {
          vec2 uv = (gl_FragCoord.xy * 2.0 - uResolution) / min(uResolution.x, uResolution.y);
          float t = uTime * 0.8;

          vec2 q = vec2(fbm(uv + vec2(0.0, t * 0.15)), fbm(uv + vec2(5.2, t * 0.12)));
          vec2 r = vec2(fbm(uv + 4.0 * q + vec2(1.7, 9.2 + 0.2 * t)), fbm(uv + 4.0 * q + vec2(8.3, 2.8 + 0.18 * t)));
          float warp = fbm(uv + 3.0 * r);

          vec2 c1 = vec2(sin(t * 0.9) * 0.45, cos(t * 0.7) * 0.85);
          vec2 c2 = vec2(cos(t * 0.8 + 2.0) * 0.55, sin(t * 1.1 + 1.0) * 0.75);
          vec2 c3 = vec2(sin(t * 1.3 + 4.0) * 0.4, cos(t * 0.6 + 3.0) * 0.9);
          vec2 c4 = vec2(cos(t * 0.5 + 1.2) * 0.35, sin(t * 0.8 + 4.5) * 0.6);

          float d1 = sdCircle(uv - c1, 0.45 + 0.08 * sin(t * 2.0));
          float d2 = sdCircle(uv - c2, 0.38 + 0.06 * cos(t * 2.3));
          float d3 = sdCircle(uv - c3, 0.42 + 0.07 * sin(t * 1.7));
          float d4 = sdCircle(uv - c4, 0.35 + 0.05 * cos(t * 1.9));

          float d = smin(d1, d2, 0.35);
          d = smin(d, d3, 0.35);
          d = smin(d, d4, 0.35);
          d += (warp - 0.5) * 0.25;

          vec3 colDeepViolet = vec3(0.04, 0.03, 0.10);
          vec3 colIndigo     = vec3(0.14, 0.05, 0.32);
          vec3 colNeonCyan   = vec3(0.00, 0.92, 0.98);
          vec3 colHotPink    = vec3(1.00, 0.05, 0.55);
          vec3 colGold       = vec3(1.00, 0.82, 0.20);

          vec3 bg = mix(colDeepViolet, colIndigo, vUv.y * 0.8 + warp * 0.2);
          float glow = exp(-max(0.0, d) * 3.5);
          float edge = 1.0 - smoothstep(-0.02, 0.06, d);
          float innerGlow = smoothstep(-0.4, 0.0, d) * (1.0 - edge);

          vec3 liquidColor = mix(colIndigo, colHotPink, clamp(r.x * 1.4, 0.0, 1.0));
          liquidColor = mix(liquidColor, colNeonCyan, clamp(q.y * 1.5, 0.0, 1.0));
          liquidColor = mix(liquidColor, colGold, pow(innerGlow, 3.0) * 0.8);

          vec3 finalColor = bg + glow * colIndigo * 0.8;
          finalColor = mix(finalColor, liquidColor, edge * 0.92);
          finalColor += pow(glow, 2.0) * colNeonCyan * 0.45;

          float vignette = 1.0 - length(vUv - 0.5) * 0.75;
          finalColor *= clamp(vignette, 0.2, 1.0);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `;

      // ======================================================================
      // 2. Layer 0: Three.js Setup (WebGL Shader Quad + 3D Mesh)
      // ======================================================================
      const threeCanvas = document.getElementById('three-layer');
      threeCanvas.width = 1080;
      threeCanvas.height = 1920;

      const renderer = new THREE.WebGLRenderer({
        canvas: threeCanvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance',
      });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      renderer.autoClear = false;

      // Background Quad Stage
      const bgScene = new THREE.Scene();
      const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const bgMaterial = new THREE.ShaderMaterial({
        vertexShader: VERTEX_SHADER_QUAD,
        fragmentShader: FRAGMENT_SHADER_LIQUID_SDF,
        uniforms: {
          uTime: { value: 0.0 },
          uResolution: { value: new THREE.Vector2(1080, 1920) },
          uProgress: { value: 0.0 },
        },
        depthWrite: false,
        depthTest: false,
      });
      const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
      bgScene.add(bgQuad);

      // Foreground 3D Scene
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1080 / 1920, 0.1, 100);
      camera.position.set(0, 0, 7.5);

      const orbitGroup = new THREE.Group();
      scene.add(orbitGroup);

      scene.add(new THREE.AmbientLight(0xffffff, 0.85));
      const keyLight = new THREE.DirectionalLight(0x00f2fe, 3.2);
      keyLight.position.set(3, 4, 5);
      scene.add(keyLight);
      const rimLight = new THREE.DirectionalLight(0xff007a, 4.0);
      rimLight.position.set(-4, -2, -3);
      scene.add(rimLight);

      const torusGeo = new THREE.TorusKnotGeometry(1.35, 0.38, 128, 32);
      const torusMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.88,
        roughness: 0.18,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
        reflectivity: 0.95,
      });
      const torusMesh = new THREE.Mesh(torusGeo, torusMat);
      torusMesh.position.set(0, 0.2, 0);
      orbitGroup.add(torusMesh);

      const satGeo = new THREE.IcosahedronGeometry(0.22, 1);
      const satMat = new THREE.MeshStandardMaterial({
        color: 0x00f2fe,
        emissive: 0x004455,
        metalness: 0.5,
        roughness: 0.3,
      });
      const satellites = [];
      for (let i = 0; i < 4; i++) {
        const sat = new THREE.Mesh(satGeo, satMat);
        orbitGroup.add(sat);
        satellites.push(sat);
      }

      function renderThree(currentTime, progress) {
        bgMaterial.uniforms.uTime.value = currentTime;
        bgMaterial.uniforms.uProgress.value = progress;

        torusMesh.rotation.x = currentTime * 0.45;
        torusMesh.rotation.y = currentTime * 0.65;
        torusMesh.position.y = 0.2 + Math.sin(currentTime * 1.6) * 0.25;

        for (let i = 0; i < satellites.length; i++) {
          const sat = satellites[i];
          const angle = currentTime * 1.2 + (i * Math.PI) / 2;
          const radius = 2.4 + 0.2 * Math.sin(currentTime * 2.0 + i);
          sat.position.set(
            Math.cos(angle) * radius,
            Math.sin(angle * 0.7) * 0.8 + 0.2,
            Math.sin(angle) * radius
          );
          sat.rotation.x = currentTime * 2.0;
        }

        camera.position.x = Math.sin(currentTime * 0.5) * 0.25;
        camera.position.y = Math.cos(currentTime * 0.6) * 0.2;
        camera.lookAt(0, 0, 0);

        renderer.clear();
        renderer.render(bgScene, bgCamera);
        renderer.clearDepth();
        renderer.render(scene, camera);
      }

      // ======================================================================
      // 3. Layer 1a: RoughJS 2D Canvas (Boiling Line Hand-Drawn Doodle)
      // ======================================================================
      const doodleCanvas = document.getElementById('doodle-layer');
      doodleCanvas.width = 1080;
      doodleCanvas.height = 1920;
      const doodleCtx = doodleCanvas.getContext('2d');
      const rc = rough.canvas(doodleCanvas);

      const doodleElements = [
        {
          id: 'box_title',
          type: 'rectangle',
          x: 100,
          y: 270,
          width: 880,
          height: 160,
          startFrame: 5,
          endFrame: 84,
          options: {
            stroke: '#00f2fe',
            strokeWidth: 4,
            roughness: 2.0,
            fill: 'rgba(0, 242, 254, 0.08)',
            fillStyle: 'cross-hatch',
          },
        },
        {
          id: 'arrow_to_3d',
          type: 'arrow',
          points: [[200, 1080], [380, 920]],
          startFrame: 90,
          endFrame: 170,
          options: {
            stroke: '#ffe600',
            strokeWidth: 4.5,
            roughness: 1.8,
          },
        },
        {
          id: 'underline_karaoke',
          type: 'underline',
          x: 180,
          y: 1390,
          width: 720,
          startFrame: 175,
          endFrame: 240,
          options: {
            stroke: '#ff007a',
            strokeWidth: 5,
            roughness: 2.2,
          },
        },
        {
          id: 'star_accent',
          type: 'circle',
          x: 940,
          y: 220,
          width: 60,
          startFrame: 0,
          endFrame: 300,
          options: {
            stroke: '#ffffff',
            strokeWidth: 3,
            fill: 'rgba(255, 230, 0, 0.4)',
            fillStyle: 'solid',
          },
        },
      ];

      function renderDoodle(frame) {
        doodleCtx.clearRect(0, 0, 1080, 1920);

        // Boiling line animation: seed shifts every 3 frames (10 FPS boiling)
        const boilSeed = Math.floor(frame / 3);

        for (const el of doodleElements) {
          if (el.startFrame !== undefined && frame < el.startFrame) continue;
          if (el.endFrame !== undefined && frame > el.endFrame) continue;

          const style = {
            roughness: el.options?.roughness ?? 1.5,
            strokeWidth: el.options?.strokeWidth ?? 3,
            stroke: el.options?.stroke ?? '#ffffff',
            fill: el.options?.fill,
            fillStyle: el.options?.fillStyle ?? 'hachure',
            seed: (el.options?.seed ?? 100) + boilSeed * 43,
            bowing: 1.2,
          };

          if (el.type === 'rectangle') {
            rc.rectangle(el.x, el.y, el.width, el.height, style);
          } else if (el.type === 'circle') {
            rc.circle(el.x, el.y, el.width, style);
          } else if (el.type === 'underline') {
            rc.line(el.x, el.y, el.x + el.width, el.y + 2, style);
            rc.line(el.x + 8, el.y + 6, el.x + el.width - 12, el.y + 7, {
              ...style,
              strokeWidth: Math.max(1, style.strokeWidth - 1),
            });
          } else if (el.type === 'arrow') {
            const [p1, p2] = el.points;
            rc.line(p1[0], p1[1], p2[0], p2[1], style);
            const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
            const headLen = 28;
            const arrowAngle = Math.PI / 6;
            rc.line(p2[0], p2[1], p2[0] - headLen * Math.cos(angle - arrowAngle), p2[1] - headLen * Math.sin(angle - arrowAngle), style);
            rc.line(p2[0], p2[1], p2[0] - headLen * Math.cos(angle + arrowAngle), p2[1] - headLen * Math.sin(angle + arrowAngle), style);
          }
        }
      }

      // ======================================================================
      // 4. Layer 1b: Lottie Vector Animation
      // ======================================================================
      const lottieContainer = document.getElementById('lottie-layer');
      const sampleLottieData = {
        v: '5.7.4', fr: 30, ip: 0, op: 90, w: 240, h: 240, nm: 'PulseRing', ddd: 0, assets: [],
        layers: [{
          ddd: 0, ind: 1, ty: 4, nm: 'PulseRing', sr: 1,
          ks: {
            o: { k: [{ i: { x: [0.833], y: [0.833] }, o: { x: [0.167], y: [0.167] }, t: 0, s: [100] }, { t: 90, s: [15] }] },
            r: { k: [{ i: { x: [0.833], y: [0.833] }, o: { x: [0.167], y: [0.167] }, t: 0, s: [0] }, { t: 90, s: [360] }] },
            p: { k: [120, 120, 0] }, a: { k: [0, 0, 0] },
            s: { k: [{ i: { x: [0.667], y: [1] }, o: { x: [0.333], y: [0] }, t: 0, s: [60, 60, 100] }, { t: 90, s: [130, 130, 100] }] }
          },
          ao: 0,
          shapes: [{
            ty: 'gr',
            it: [
              { ty: 'el', p: { k: [0, 0] }, s: { k: [140, 140] } },
              { ty: 'st', c: { k: [0, 0.95, 1, 1] }, o: { k: 100 }, w: { k: 6 }, lc: 2, lj: 2 },
              { ty: 'tr', p: { k: [0, 0] }, a: { k: [0, 0] }, s: { k: [100, 100] }, r: { k: 0 }, o: { k: 100 } }
            ]
          }],
          ip: 0, op: 90, st: 0, bm: 0
        }]
      };

      const anim = lottie.loadAnimation({
        container: lottieContainer,
        renderer: 'svg',
        loop: false,
        autoplay: false,
        animationData: sampleLottieData,
      });

      function renderLottie(frame) {
        if (!anim) return;
        const total = anim.totalFrames || 90;
        anim.goToAndStop(frame % total, true);
      }

      // ======================================================================
      // 5. Layer 2: ZeroTTS Word-by-Word Karaoke Subtitles
      // ======================================================================
      const karaokeContainer = document.getElementById('karaoke-layer');
      const transcriptLines = [
        {
          id: 'line_1',
          start: 0.3,
          end: 2.8,
          words: [
            { word: 'KIẾN', start: 0.3, end: 0.7 },
            { word: 'TRÚC', start: 0.7, end: 1.1 },
            { word: 'ĐA', start: 1.1, end: 1.5 },
            { word: 'TẦNG', start: 1.5, end: 2.0, emphasis: true },
            { word: 'ĐỈNH', start: 2.0, end: 2.4 },
            { word: 'CAO', start: 2.4, end: 2.8, emphasis: true },
          ],
        },
        {
          id: 'line_2',
          start: 3.1,
          end: 5.6,
          words: [
            { word: 'THREE.JS', start: 3.1, end: 3.7, emphasis: true },
            { word: 'VÀ', start: 3.7, end: 4.1 },
            { word: 'SHADER', start: 4.1, end: 4.7 },
            { word: 'LIQUID', start: 4.7, end: 5.1, emphasis: true },
            { word: 'SDF', start: 5.1, end: 5.6, emphasis: true },
          ],
        },
        {
          id: 'line_3',
          start: 5.9,
          end: 7.8,
          words: [
            { word: 'ROUGHJS', start: 5.9, end: 6.4, emphasis: true },
            { word: 'VẼ', start: 6.4, end: 6.7 },
            { word: 'TAY', start: 6.7, end: 7.0 },
            { word: 'RUNG', start: 7.0, end: 7.4 },
            { word: 'HOẠT', start: 7.4, end: 7.6 },
            { word: 'HÌNH', start: 7.6, end: 7.8, emphasis: true },
          ],
        },
        {
          id: 'line_4',
          start: 8.0,
          end: 9.8,
          words: [
            { word: 'KARAOKE', start: 8.0, end: 8.4, emphasis: true },
            { word: 'SYNC', start: 8.4, end: 8.7 },
            { word: 'TỪNG', start: 8.7, end: 9.0 },
            { word: 'TỪ', start: 9.0, end: 9.3 },
            { word: 'CỰC', start: 9.3, end: 9.5 },
            { word: 'CHUẨN', start: 9.5, end: 9.8, emphasis: true },
          ],
        },
      ];

      // Build Karaoke DOM
      karaokeContainer.innerHTML = '';
      const safeZone = document.createElement('div');
      safeZone.style.cssText = 'position:absolute;bottom:620px;left:0;width:1080px;padding:0 40px;display:flex;justify-content:center;align-items:center;pointer-events:none;';
      karaokeContainer.appendChild(safeZone);

      const builtLines = transcriptLines.map((line) => {
        const lineEl = document.createElement('div');
        lineEl.style.cssText = 'position:absolute;width:100%;max-width:960px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px 22px;opacity:0;visibility:hidden;';

        const wordEls = line.words.map((w) => {
          const span = document.createElement('span');
          span.textContent = w.word;
          span.style.cssText = 'display:inline-block;font-size:66px;font-weight:900;letter-spacing:-0.02em;text-transform:uppercase;padding:6px 18px;border-radius:18px;color:rgba(255,255,255,0.42);transition:none;';
          lineEl.appendChild(span);
          return { word: w, span };
        });

        safeZone.appendChild(lineEl);
        return { line, lineEl, wordEls };
      });

      function renderKaraoke(currentTime) {
        for (const { line, lineEl, wordEls } of builtLines) {
          const isActive = currentTime >= line.start && currentTime <= line.end;
          if (isActive) {
            lineEl.style.opacity = '1';
            lineEl.style.visibility = 'visible';

            for (const { word, span } of wordEls) {
              if (currentTime < word.start) {
                // Upcoming
                span.style.color = 'rgba(255, 255, 255, 0.42)';
                span.style.background = 'transparent';
                span.style.border = '2px solid transparent';
                span.style.boxShadow = 'none';
                span.style.transform = 'scale(1.0)';
              } else if (currentTime >= word.start && currentTime <= word.end) {
                // Active karaoke highlight
                if (word.emphasis) {
                  span.style.color = '#00f2fe';
                  span.style.background = 'rgba(0, 242, 254, 0.24)';
                  span.style.border = '2px solid #00f2fe';
                  span.style.boxShadow = '0 0 45px rgba(0, 242, 254, 0.8), 0 4px 15px rgba(0, 0, 0, 0.9)';
                  span.style.transform = 'scale(1.18) translateY(-6px)';
                } else {
                  span.style.color = '#ffe600';
                  span.style.background = 'rgba(255, 230, 0, 0.20)';
                  span.style.border = '2px solid rgba(255, 230, 0, 0.9)';
                  span.style.boxShadow = '0 0 35px rgba(255, 230, 0, 0.65), 0 4px 12px rgba(0, 0, 0, 0.8)';
                  span.style.transform = 'scale(1.10) translateY(-4px)';
                }
              } else {
                // Completed
                span.style.color = '#ffffff';
                span.style.background = 'transparent';
                span.style.border = '2px solid transparent';
                span.style.boxShadow = 'none';
                span.style.transform = 'scale(1.0)';
              }
            }
          } else {
            lineEl.style.opacity = '0';
            lineEl.style.visibility = 'hidden';
          }
        }
      }

      // ======================================================================
      // 6. Master Deterministic Hook into Hyperframes
      // ======================================================================
      const DURATION = 10;
      const FPS = 30;

      function renderAt(time) {
        const clamped = Math.max(0, Math.min(time, DURATION));
        const progress = clamped / DURATION;
        const frame = Math.floor(clamped * FPS);

        renderThree(clamped, progress);
        renderDoodle(frame);
        renderLottie(frame);
        renderKaraoke(clamped);
      }

      // Hook 1: CustomEvent 'hf-seek' from Hyperframes engine
      window.addEventListener('hf-seek', (e) => {
        renderAt(e.detail.time);
      });

      // Hook 2: Paused GSAP Root Timeline
      const masterState = { time: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(masterState, {
        time: DURATION,
        duration: DURATION,
        ease: 'none',
        onUpdate: () => {
          renderAt(masterState.time);
        },
      }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines['main'] = tl;

      // Prime to frame 0
      tl.seek(0);
      renderAt(0);
    </script>
  </body>
</html>
